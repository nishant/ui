name: fan-out
on:
  push:
    tags: ['v*.*.*']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag: { description: 'Tag to fan out, or latest', default: latest, type: string }
      repo: { description: 'One repo (owner/name), or all', default: all, type: string }
permissions: { contents: read }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.FLEET_TOKEN }}
          REPO_INPUT: ${{ inputs.repo || 'all' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            {
              echo '### Nothing was fanned out'
              echo
              echo 'FLEET_TOKEN is not set, so nothing was fanned out. Create a fine-grained token (owner nishant; repositories: the ones in hosting's catalog.json and nishant/hosting itself; Contents, Pull requests and Commit statuses read and write, Actions read) and run: `gh secret set FLEET_TOKEN --repo nishant/ui`'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api repos/nishant/hosting/contents/catalog.json -H "Accept: application/vnd.github.raw" > catalog.json
          node tools/fanout/fleet.mjs catalog.json --matrix --repo "$REPO_INPUT" >> "$GITHUB_OUTPUT"
  fanout:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: fanout-${{ matrix.repo }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.FLEET_TOKEN }}
      FAN_TAG: ${{ github.event_name == 'push' && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.tag || 'latest') }}
      FAN_WAIT: ${{ github.event_name == 'schedule' && '0' || '60' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: corepack enable
      - name: Fetch the fleet list
        run: |
          gh api repos/nishant/hosting/contents/catalog.json -H "Accept: application/vnd.github.raw" > catalog.json
      - name: Git identity
        run: |
          git config --global user.name "ui fan-out"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fan out
        env:
          FAN_REPO: ${{ matrix.repo }}
        run: node tools/fanout/fanout.mjs --catalog catalog.json --repo "$FAN_REPO" --tag "$FAN_TAG" --wait "$FAN_WAIT"
