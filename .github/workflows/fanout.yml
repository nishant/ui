name: fan-out
on:
  push:
    tags: ['v*.*.*']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tag: { description: 'Tag to fan out, or latest', default: latest, type: string }
      repo: { description: 'One repo (owner/name), or all', default: all, type: string }
      now: { description: 'Open bump PRs now, without waiting for releases to settle', default: false, type: boolean }
permissions: { contents: read }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The release dispatches this run right after `npm publish`, and npm can take minutes to serve
      # the new tarball. Bump PRs opened before that fail `npm ci` with E404, so wait for it first.
      - name: Wait until npm serves the tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ github.event_name == 'push' && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.tag || 'latest') }}
        run: |
          tag="$TAG_INPUT"
          if [ "$tag" = latest ]; then tag=$(gh api repos/nishant/ui/releases/latest --jq .tag_name); fi
          url="https://registry.npmjs.org/nish-ui/-/nish-ui-${tag#v}.tgz"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
            if [ "$code" = 200 ]; then echo "npm serves $url"; exit 0; fi
            echo "npm answered $code for $url, waiting"
            sleep 15
          done
          echo "::warning::npm still does not serve $url after 15 minutes; bump PRs may fail to install"
      - id: plan
        env:
          GH_TOKEN: ${{ secrets.FLEET_TOKEN }}
          REPO_INPUT: ${{ inputs.repo || 'all' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            {
              echo '### Nothing was fanned out'
              echo
              echo 'FLEET_TOKEN is not set, so nothing was fanned out. Create a fine-grained token (owner nishant; repositories: the ones in catalog.json in nishant/hosting and nishant/hosting itself; Contents, Pull requests and Commit statuses read and write, Actions read) and run: `gh secret set FLEET_TOKEN --repo nishant/ui`'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api repos/nishant/hosting/contents/catalog.json -H "Accept: application/vnd.github.raw" > catalog.json
          node tools/fanout/fleet.mjs catalog.json --matrix --repo "$REPO_INPUT" >> "$GITHUB_OUTPUT"
  fanout:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: fanout-${{ matrix.repo }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.FLEET_TOKEN }}
      FAN_TAG: ${{ github.event_name == 'push' && github.ref_name || (github.event_name == 'workflow_dispatch' && inputs.tag || 'latest') }}
      FAN_WAIT: ${{ github.event_name == 'schedule' && '0' || '60' }}
      # Bump PRs open only once the newest release is this many minutes old, so a burst of releases
      # is one round of app checks, not one per release (15 releases on Nov 2-3, 2026 used a month of
      # private-repo Actions minutes). The hourly run picks the burst up; now=true skips the wait.
      FAN_QUIET: ${{ inputs.now == true && '0' || vars.FANOUT_QUIET_MIN || '120' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: corepack enable
      - name: Fetch the fleet list
        run: |
          gh api repos/nishant/hosting/contents/catalog.json -H "Accept: application/vnd.github.raw" > catalog.json
      - name: Git identity
        run: |
          git config --global user.name "ui fan-out"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Fan out
        env:
          FAN_REPO: ${{ matrix.repo }}
        run: node tools/fanout/fanout.mjs --catalog catalog.json --repo "$FAN_REPO" --tag "$FAN_TAG" --wait "$FAN_WAIT" --quiet "$FAN_QUIET"
