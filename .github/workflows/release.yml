name: release
# Cuts a release from master: gh workflow run release.yml -R nishant/ui -f bump=minor
# The CHANGELOG entry for the new version must already be on master.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'patch, minor, major or x.y.z'
        required: true
        default: patch
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Git identity
        run: |
          git config user.name "ui release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: node scripts/release.mjs "$BUMP" --ci
