name: publish
# Publishes a release tag to npm as nish-ui (docs/RELEASING.md, "npm").
# scripts/release.mjs --ci dispatches it after every release. By hand:
#   gh workflow run publish.yml -R nishant/ui -f tag=vX.Y.Z
# Auth is npm trusted publishing only (OIDC, id-token below): no NPM_TOKEN, and nish-ui disallows tokens.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (vX.Y.Z)'
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    # The job holds the OIDC token npm trusts, so only master's tooling may run it.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # master for the tooling (the job only runs on master), the tag (which carries dist/) as the package.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; pinned so the job that holds id-token does not float.
      - name: Update npm
        run: npm install -g npm@11.6.2
      - name: Check out the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Not a release tag $TAG"; exit 1 ;;
          esac
          git worktree add --detach "$RUNNER_TEMP/pkg" "refs/tags/$TAG"
      - name: Publish
        env:
          TAG: ${{ inputs.tag }}
        run: node tools/npm-publish.mjs "$RUNNER_TEMP/pkg" --tag "$TAG"
