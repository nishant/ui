name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # typecheck, WCAG contrast for every theme, build
      - run: npm run check
      - run: npm run test:tools
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - name: Overlay interaction specs
        run: npx playwright test
      - name: Visual check of the demo gallery
        run: |
          npx vite --config demo/vite.config.ts --port 5190 &
          npx wait-on -t 60000 http://localhost:5190
          node tools/visual-check.mjs tools/demo.visual.json
      - name: Visual check of the docs site
        run: |
          npx vite build --config site/vite.config.ts
          npx vite preview --config site/vite.config.ts --port 5191 &
          npx wait-on -t 60000 http://localhost:5191
          node tools/visual-check.mjs tools/site.visual.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-out
          path: |
            visual-out
            test-results
