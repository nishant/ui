name: ci
on:
  push:
    branches: [master]
  pull_request:
permissions: { contents: read }

# A new push to a pull request cancels the run it replaces; master runs always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # typecheck, WCAG contrast for every theme, build, the tool checks, lint, size budgets
      - run: npm run check
      - run: npm run test:tools
      # dom + node (SSR, multi-copy) vitest projects, with the coverage thresholds in vitest.config.ts
      - name: Unit tests (dom and SSR projects) with coverage
        run: npm run test:unit -- --coverage
      - run: npx playwright install --with-deps chromium
      # overlay, elements, hydration, axe, forced-colors, RTL and CSP specs (Chromium)
      - name: Browser specs
        run: npx playwright test
      - name: Visual check of the demo gallery
        run: |
          npx vite --config demo/vite.config.ts --port 5190 &
          npx wait-on -t 60000 http://localhost:5190
          node tools/visual-check.mjs tools/demo.visual.json
      - name: Visual check of the docs site
        run: |
          npx vite build --config site/vite.config.ts
          node tools/site-bundle-check.mjs
          npx vite preview --config site/vite.config.ts --port 5191 &
          npx wait-on -t 60000 http://localhost:5191
          node tools/visual-check.mjs tools/site.visual.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual-out
          path: |
            visual-out
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 14

  # The overlay specs again in Firefox and WebKit (the Chromium run is in the check job).
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps firefox webkit
      - name: Overlay specs in Firefox and WebKit
        run: npx playwright test --project=firefox --project=webkit
        env:
          NISH_BROWSERS: all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browsers-out
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  # The packed tarball installed into a Next.js (App Router), a Vite + Tailwind and a TypeScript
  # (5.4, 5.9, 6.0 x bundler and node16) consumer, the way an outside team would use it.
  consumers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture: [next, vite, ts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        if: matrix.fixture != 'ts'
        run: npx playwright install --with-deps chromium
      - name: Consumer check (${{ matrix.fixture }})
        run: node tools/consumer-check.mjs ${{ matrix.fixture }}

  # Fold check on pull requests: builds the base and the head docs site, screenshots both at
  # 360, 840 and 1440 in light and dark, and fails on any problem the PR adds. The workflow it
  # calls needs fold.visual.json (URLs with {port}) at the repo root.
  visual:
    if: github.event_name == 'pull_request'
    permissions: { contents: read, pull-requests: write }
    uses: ./.github/workflows/fold-check.yml
    with:
      config: fold.visual.json
      serve: npm run build:site && exec npx vite preview --config site/vite.config.ts --host 127.0.0.1 --port "$FOLD_PORT" --strictPort
      node-version: '24'
      tools-ref: ${{ github.event.pull_request.head.sha }}
