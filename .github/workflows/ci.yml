name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # typecheck, WCAG contrast for every theme, build
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Visual check of the demo gallery
        run: |
          npx vite --config demo/vite.config.ts --port 5190 &
          npx wait-on -t 60000 http://localhost:5190
          node tools/visual-check.mjs tools/demo.visual.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-out
          path: visual-out
